global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    host: server

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # HTTP probes of the services on the host. Add a URL here and it appears in
  # the availability dashboard and the ProbeFailing alert automatically.
  #
  # Two jobs because one service rejects a foreign Host header: Next.js returns
  # 400 when asked for host.docker.internal, so those targets are probed with an
  # explicit Host of localhost. Both modules are otherwise identical.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://host.docker.internal:8080/
          - http://host.docker.internal:3002/
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-http-localhost-host
    metrics_path: /probe
    params:
      module: [http_2xx_localhost_3001]
    static_configs:
      - targets:
          - http://host.docker.internal:3001/
    relabel_configs: *blackbox_relabel

  # The task queue API's own metrics. Scraped by container name over the shared
  # monitoring network rather than through the host, so the API does not need a
  # port open to the LAN. The API stack declares the alias `taskqueue-api`.
  - job_name: task-queue
    metrics_path: /metrics
    static_configs:
      - targets: ["taskqueue-api:8000"]
