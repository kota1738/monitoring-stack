modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [200, 301, 302, 401]
  # For services that validate the Host header and answer 400 to
  # host.docker.internal (Next.js does, and it insists on host:port). The value
  # is fixed because blackbox cannot template per-target headers; add another
  # module if a second service needs a different port here.
  http_2xx_localhost_3001:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [200, 301, 302, 401]
      headers:
        Host: localhost:3001

  http_post_2xx:
    prober: http
    timeout: 5s
    http:
      method: POST
  tcp_connect:
    prober: tcp
    timeout: 5s
  icmp:
    prober: icmp
    timeout: 5s
